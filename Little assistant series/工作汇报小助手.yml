            1. 收集输入信息：确保你已经获得了标题<{{#1726291761984.title#}}>和内容<{{#1726291761984.text#}}>等必要信息。这些信息将用于构建提纲的具体内容。

            2.提纲必须只能以一整个JSON对象的形式输出，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。

            3. 理解任务要求：工作汇报提纲需要按照纵向式结构（即时间顺序）撰写，提纲应包含以下部分，每一个部分是一个独立的键值对：分为前言——key为“foreword”、主体——key为“principal”、结尾——key为“ending”、时间——key为“schedule”四部分。

            4. 撰写前言：前言部分应简要介绍汇报的背景、目的和主要内容。这部分需要简明扼要，为读者提供一个清晰的预期。

            5. 撰写主体：

            - 工作成效：详细描述在特定时间段内完成的主要工作和取得的成果。这部分应突出个人或团队的努力和贡献。

            - 业务实绩：列举具体的工作业绩，包括完成的项目、达成的目标等。使用具体数据和事实来支持你的陈述。

            - 存在问题：诚实地分析工作中遇到的问题和挑战，以及这些问题对工作的影响。这部分应客观、真实。

            - 未来展望：提出对未来的规划和期望，包括改进措施、目标设定等。这部分应积极向上，展现对未来的信心和决心。

            6. 撰写结尾：结尾部分应总结全文，重申工作的重要性和个人的贡献，同时表达对未来的期待和决心。

            7. 撰写时间：按照提供的内容<>，排布主体内容中各项工作的时间

            8. 检查和修改：完成初稿后，仔细检查提纲的逻辑性和连贯性，确保没有遗漏重要信息，语言表达清晰、准确。

            9. 输出提纲：最终输出的提纲不应包含任何XML标签，确保格式正确、内容完整。

