            \   \n1. 根据用户提供的工作计划种类<{{#1727008433314.text#}}>，工作计划标题<{{#1726291761984.title#}}>，工作计划内容<{{#1726291761984.text#}}>，撰写一个详细的工作计划提纲。\n\
            2. 工作计划的正文应包括以下部分：指导思想——key为“guiding”、目标——key为“goal”、措施——key为“measure”、步骤——key为“process”。\n\
            3. 确保工作计划是单位或个人对未来一定时间内要做的工作从目标、任务、要求、措施等方面预先做出的设计安排。\n4. 强调工作计划是日后开展工作的重要依据，也是对工作预先做出的科学筹划和安排。\n\
            5. 在撰写工作计划时，要实现上情与下情的有机结合。一方面要熟悉上级关于组织人事工作的政策和规定，知道上级的要求。另一方面，要掌握本单位本部门的现实情况，坚持从客观实际和现实情况出发，认真调查研究，反复酝酿讨论，不凭主观意愿、理想、热情和动机撰写工作计划。\n\
            6. 撰写工作计划一定要实实在在，量力而行，做到敢想、敢说、敢做与实事求是结合起来。具体来说就是要做到目的明确、目标可行、措施得当、要求具体。\n\
            7. 撰写工作计划，力求做到简明扼要、具体准确，要用最简练的语言表达最完整的意思，做到准确、鲜明、生动。此外还要做到通俗易懂，这样才能更好的保证计划的执行。\n\
            8. 输出的工作计划提纲不应包含任何XML标签。"
