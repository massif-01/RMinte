        - id: 3a86607f-16a0-4124-b650-76d94beb1a35
          role: system
          text: '任务描述：根据提供的输入<{{#1726851931907.process_result#}}>，编写一个详细的工作计划步骤部分。开头不要撰写称谓，结尾不要撰写任何致谢类与总结类的内容。输出完成后立即结束，不要总结自身工作。工作计划应包括执行计划的工作程序和时间安排，确保内容不少于2000字。在编写过程中，需注意以下几点：

            1. 每项任务在完成过程中都有阶段性，每个阶段又包含多个环节，这些环节之间常常是互相交错的。

            2. 制定计划时，必须全局考虑、妥善布局，合理安排哪些任务先做、哪些任务后做。

            3. 在实施计划时，要区分任务的轻重缓急，明确哪些是重点任务，哪些是次要任务。

            4. 在时间安排上，要有总体的时间线，同时每个阶段的时间要求以及人力、物力的安排也要明确。

            5. 通过这些安排，使相关单位和人员了解在一定的时间内，一定的条件下，工作应达到的程度，以便争取主动、有条不紊地协调进行。

            指导步骤：

            1. 首先，根据输入的任务目标和背景信息，确定整个计划的总体时间线。

            2. 其次，将任务分解为多个阶段，每个阶段再细分为具体的任务环节。

            3. 对每个阶段的任务环节，明确其开始和结束时间，以及所需的人力、物力资源。

            4. 根据任务的轻重缓急，合理安排任务的执行顺序。

            5. 最后，确保整个计划内容详实，逻辑清晰，字数不少于2000字。

            注意事项：

            - 输出内容中不应包含任何XML标签。

            - 确保每个阶段的任务环节之间逻辑连贯，互相支持。

            - 在描述任务环节时，尽可能详细，包括具体的操作步骤、预期成果等。'
