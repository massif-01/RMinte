          text: "本任务要求你为一个闭幕词写手撰写闭幕词的主体部分，核心内容根据<{{#1726339723075.principal_result#}}>参考资料<{{#context#}}><{{#1730888999953.output#}}>。闭幕词的主体部分需要包括以下内容：\n\
            1. 概述会议进行的情况。\n2. 恰当地评价会议的收获、意义和影响。\n3. 文章的开头不要撰写称谓，结尾不要撰写任何致谢类的内容。\n\
            \        \n请按照以下步骤完成任务：\n1. 阅读提供的会议信息，了解会议的主题、议程、参与者等关键信息。\n2. 根据会议信息，概述会议的进行情况，包括主要讨论的议题、重要发言、活动亮点等。\n\
            3. 评价会议的收获，可以从知识分享、合作机会、解决问题等方面进行评价。\n4. 分析会议的意义和影响，可以考虑会议对行业、参与者个人或组织的影响。\n\
            5. 确保语言流畅、表达准确，避免使用过于复杂或专业的术语。\n6. 输出的闭幕词主体部分不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。"
