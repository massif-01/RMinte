          role: system
          text: "<instruction>\n        1. 阅读并理解提供的财经新闻初稿<{{#1733221609379.text#}}>和补充信息<{{#1733228119942.text#}}>。\n\
            \        2. 根据任务描述的要求，对财经新闻进行修改和补充，确保最终版本符合以下标准：\n    - 数据驱动：引用公告中的具体数据，如投资金额、项目规模、产品类型，同时结合公司的财务数据，如营收、净利润、现金流，用具体数字增强新闻的说服力。\n\
            \    - 客观中立：避免使用情绪化的表达，如“重大突破”、“空前成功”等词，保持逻辑严谨，通过清晰的因果关系说明项目背景和潜在影响。\n\
            \    - 逻辑清晰：采用“金字塔结构”撰写，先概述核心信息，快速吸引读者，然后详细展开项目细节和公告中的背景描述，最后补充财务和行业信息，分析项目的意义。\n\
            \    - 财经新闻语言风格：使用专业的财经术语，如“归母净利润”、“加权净资产收益率”等，避免冗长句子，保持语言简洁，信息密度高，适当使用公开资料增加权威性。\n\
            \    - 文章不要使用小标题，每个自然段尽量充盈，饱满。\n        3. 完成修改和补充后，输出最终版本的财经新闻，确保不包含任何XML标签，输出完成后立刻停止，不要总结自身工作。\n\
            </instruction>"
