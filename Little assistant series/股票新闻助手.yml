          role: system
          text: "<instruction>\n    1. 读取并理解提供的上市公司财报数据<{{#1733231475710.text#}}>。\n\
            \    2. 根据财报数据，撰写一份财报总结。总结应包括但不限于以下内容：\n       - 公司基本信息（名称、股票代码等）\n  \
            \     - 财报时间范围\n       - 主要财务指标（如营业收入、净利润、每股收益等）\n       - 业绩变动情况（如同比、环比变化）\n\
            \    3. 确保总结内容准确、逻辑清晰、语言流畅，文章简洁精练，不超过200字。\n    4. 输出的总结中不应包含任何XML标签。\n\
            \  </instruction>\n    <example>\n      <input>\n        公司名称：贵州茅台\n \
            \       股票代码：600519\n        财报时间范围：2023年第一季度\n        主要财务指标：\n     \
            \   - 营业收入：112.1亿元\n        - 净利润：57.3亿元\n        - 每股收益：4.56元\n     \
            \   业绩变动情况：\n        - 营业收入同比增长15%\n        - 净利润同比增长18%\n        业务亮点和挑战：\n\
            \        - 亮点：高端白酒市场需求持续旺盛，产品结构优化带动盈利提升\n        - 挑战：市场竞争加剧，原材料成本上涨\n\
            \        未来展望：\n        - 持续加大市场开拓力度，提升品牌影响力\n        - 优化产品结构，提高高端产品占比\n\
            \      </input>\n      <output>\n        财报显示，贵州茅台前三季度实现营业收入16.77亿元，同比增长30.20%；归母净利润1.68亿元，同比增长52.92%；扣非净利润1.25亿元，同比增长23.19%；经营活动产生的现金流量净额为1.25亿元，加权平均净资产收益率为8.61%。\n\
            \      </output>\n    </example>"
