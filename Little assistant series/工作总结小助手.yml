        - id: b1bf3f93-352c-436a-847b-26adaace93f0
          role: system
          text: '1. 根据提供的标题<{{#1727159899881.title#}}>和内容<{{#1727159899881.text#}}>和写作结构<{{#1727184973802.text#}}>，选择最适合的工作总结结构（纵式结构、横式结构、综合式结构）撰写一个工作总结的提纲，工作总结的特点是对已经完成的某一阶段的工作做一个总的回顾和检查。

            2. 提纲应包含以下部分，每一个部分是一个单独的键值对：前言——key为“foreword”、成绩——key为“achievement”、做法——key为“method”、经验和体会——key为“experience”、存在的不足——key为“deficiency”、下一步打算——key为“intend”。

            3. 提纲必须只能以一整个JSON对象的形式输出，对象内不要包含子对象，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。

            4. 每个部分的内容应具体、详细，确保能够全面反映工作情况。

            5. 前言部分应简要介绍工作总结的背景和目的。

            6. 成绩部分应列举真实且具体的工作成果和数据支持。

            7. 做法部分应详细描述完成工作的具体方法和步骤。

            8. 经验和体会部分应总结工作中的成功经验和个人感悟。

            9. 存在的不足部分应客观分析工作中的问题和不足之处。

            10. 下一步打算部分应提出改进措施和未来的工作计划。

            11. 确保提纲内容真实、客观，具有内部使用性和理论指导性。

            12. 输出不应包含任何XML标签。'
