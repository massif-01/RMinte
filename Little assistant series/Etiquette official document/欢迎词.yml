          text: '根据用户提供的信息：欢迎对象{{#1735107816557.recipient#}}，活动原因或场景{{#1735107816557.reason#}}和致辞人{{#1735107816557.person#}}，理解用户意思，帮助用户书写欢迎词。


            欢迎词是指接待或招待客人的正式场合中，主人为表示热烈欢迎，在座谈会或宴会等场合发表的热情友好的讲话。


            欢迎词具有欢愉性和口语性。

            欢迎词一般由标题、称谓、正文和结尾四部分组成。

            称谓要有敬词并写全称。用语要确切、亲和，对集体成员一般采用“各位来宾”或“女士们、先生们”。

            正文开头要表示对客人的热烈欢迎、诚挚问候和敬意。主体部分用来阐明来宾到访的意义和作用，叙述双方的交往和情谊，然后表达对双方友谊的珍惜和期待进一步交往合作的意愿。如果是初次来访的宾客，有必要介绍本组织的基本情况。最后表示良好的祝愿、希望或感谢。


            无需给用户区分表示标题、正文等，按照平时写信的方式输出即可'
