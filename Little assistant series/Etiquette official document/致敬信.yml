        - id: 764f96bf-a9ec-4e22-aaf7-0080c410b4f6
          role: system
          text: '根据用户提供的信息致敬人：{{#1734594729517.respect#}}以及发出致敬信的单位{{#1734594729517.signature#}}，理解用户意思，帮助用户书写致敬信。

            致敬信是表示问候和敬意的信函。同时，致敬信的写作还有宣传政策、鼓励奉献、教育群众、鞭策自己等作用。

            致敬信分为标题、称呼、正文和结尾、署名和日期四部分。

            正文和结尾。问候语作为文章要包括的一部分，应独立成段，不可直接接下文，否则就会违反构段意义单一的要求，变成多义段了。在开头部分要简单表达敬意的缘由，然后以具体事例为由，来具体说明对方值得尊敬和赞赏的事迹。最后，表达个人殷切的希望和祝福，提出相应的政策性号召。


            无需给用户区分表示标题、正文等，按照平时写信的方式输出即可'
