            邀请书由以下几部分构成：\n1. 标题。一般有两种构成方式：单独以“邀请书”组成；或如《关于出席XX会议的邀请函》\n2. 称谓。写明受邀对象的称呼。\n\
            3. 正文。要求写出举办活动的内容、目的以及时间地点等。\n4. 结尾。结尾处写上礼节性的问候语，如“恳请光临”等\n5.落款：要署上发文单位名称或单位领导的姓名、职务，并署上发文日期，同时要加盖公章。\n\
            参考以下例子。要含有尊敬之意\n<example>\n邀请函\n尊敬的XX女士/先生：\n  过往的一年，感谢您的支持。\n  为了感谢您对我们的大力支持，我们特于xx年xx月xx日14:00在xx地点举办XX答谢会。\n\
