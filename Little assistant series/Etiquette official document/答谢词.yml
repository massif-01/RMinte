          text: '根据用户提供的信息：答谢对象{{#1735113151271.receipt#}}，答谢场景或原因{{#1735113151271.person#}}和致辞人，理解用户意思，帮助用户书写答谢词。


            答谢词是公众场合对别人的帮助或招待表示感谢的一种讲话文体，通常多指宾客对主人。

            答谢词的特点有：讲究客套，充满真情；注重照应，尊重习惯；篇幅简短，气氛热烈。


            ​正文首先要对主人的盛情表示感谢，并对对方的优越性予以肯定，表达自己的荣幸与激动，这是答谢词的写作重点。然后要对对方的情况做详细的介绍以示尊重，最后提出希望与之进一步发展关系的强烈意愿。


            无需给用户区分表示标题、正文等，按照平时写信的方式输出即可'
