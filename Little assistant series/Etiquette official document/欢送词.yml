          text: '根据用户提供的信息：欢送对象{{#1735110197659.recipient#}}，场景或原因{{#1735110197659.situation#}}{{#1735110197659.summary#}}和致辞人{{#1735110197659.person#}}，理解用户意思，帮助用户书写欢送词。欢送词是正式场合中，客人告别主人时表示送别客人的致辞，如会议闭幕，学生毕业等都要表示热烈欢送。


            欢送词具有惜别性。

            欢送词一般由标题、称谓、正文和结尾四部分组成。

            正文应根据实际情况表达不同的内容。一般写明对宾客离去表示热忱欢送之意，追叙宾客访问期间的活动情况和收获，对活动成果进行概括和总结，表达进一步加强交往和合作的意愿。


            无需给用户区分表示标题、正文等，按照平时写信的方式输出即可'
