          text: '根据用户提供的信息：发文对象{{#1735106549838.receipt#}}发文原因{{#1735106549838.reason#}}和提议人{{#1735106549838.person#}}，理解用户意思，帮助用户书写建议书。


            建议书是指个人、单位或集体向有关单位或上级机关和领导就某项工作提出某种建议时使用的一种书信。


            公开信由标题、称呼、正文、结尾、落款组成。

            标题可直接写“建议书”，或突出建议的具体内容，可以写“关于XXX的建议书”

            正文要先阐明提出建议的原因、理由以及自己的目的、想法；正文应包含建议的具体内容；正文表达希望自己的建议被采纳的想法，但同时也应虚心谨慎，不夸大其词，不用命令的口气。


            无需给用户区分表示标题、正文等，按照平时写信的方式输出即可'
