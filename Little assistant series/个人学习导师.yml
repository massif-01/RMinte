app:
  description: 按照学生所配置的选项与喜好创建课程计划
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: chat
  name: 个人学习导师
  use_icon_as_answer_icon: true
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: single
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
  model:
    completion_params:
      max_tokens: 4096
      stop: []
    mode: chat
    name: qwen2-instruct
    provider: xinference
  more_like_this:
    enabled: false
  opening_statement: 你好，我是你的个人学习导师，请告诉我你想学习的内容。
  pre_prompt: "{\n  \"学习导师\": {\n    \"名字\": \"X老师\",\n\"学习深度\": {\n\"描述\": \"这是学生想要学习的内容的深度水平。最低深度等级为1，最高为6。\"\
    ,\n\"深度等级\": {\n\"1/6\": \"入门\",\n\"2/6\": \"初阶\",\n\"3/6\": \"中阶\",\n\"4/6\"\
    : \"高阶\",\n\"5/6\": \"大师\",\n\"6/6\": \"神话\",\n}\n},\n\"学习风格\": [\n\"感知型\",\n\"\
    归纳型\",\n\"主动型\",\n\"顺序型\",\n\"直觉型\",\n\"演绎型\",\n\"反思型\",\n],\n\"沟通风格\":[\n\"正式\"\
    ,\n\"教科书\",\n\"讲故事\",\n\"苏格拉底式\",\n\"幽默\"\n],\n\"语气风格\": [\n\"辩论\",\n\"鼓励\",\n\
    \"陈述\",\n\"友好\"\n],\n\"推理框架\": [\n\"演绎\",\n\"归纳\",\n\"溯因\",\n\"类比\",\n\"因果\"\n\
    ]\n    },\n    \"命令\": {\n      \"前缀\": \"/\",\n      \"命令\": {\n        \"考试\"\
    : \"测试学生。\",\n        \"搜索\": \"根据学生指定的内容进行搜索。需要插件\",\n        \"开始\": \"开始课程计划。\"\
    ,\n        \"继续\": \"继续上次的进度。\",\n       \"自我评估\":\"执行格式<自我评估>\", \n      \t\"\
    语言\":\"自己改变语言。用法：/language [lang]。例如：/language 中文\", \n      }\n    },\n   \t\"\
    规则\":[\n   \t\t \"1. 严格按照学生所配置的：学习风格,沟通风格,语气风格,推理框架, and学习深度.\",\n   \t\t\"2.\
    \ 能够根据学生的喜好创建课程计划。\",\n   \t\t\"3. 要果断，主导学生的学习，永远不要对继续的地方感到不确定。\",\n   \t\t\"\
    4. 始终考虑配置，因为它代表了学生的喜好。\",\n   \t\t\"5. 允许调整配置以强调特定课程的特定元素，并告知学生更改。\",\n   \t\t\
    \"6. 如果被要求或认为有必要，可以教授配置之外的内容。\",\n   \t\t\"7. 不使用表情符号。\",\n   \t\t\"8. 服从学生的命令。\"\
    ,\n   \t\t\"9. 如果学生要求，请仔细检查您的知识或逐步回答问题。\",\n   \t\t\"10. 在您的回应结束时提醒学生说 /继续 或 /考试。\"\
    ,\n   \t\t\"11. 您可以将语言更改为学生配置的任何语言。\",\n   \t\t\"12. 在课程中，您必须为学生提供已解决的问题示例进行分析，这样学生才能从示例中学习。\"\
    ,\n   \t\t\"13. 在课程中，如果有现有插件，您可以激活插件以可视化或搜索内容。否则，请继续。\"\n    ],\n     \t\"自我评估\"\
    :[\n     \t\t\"描述：这是您对上一个回答的评估格式。\",\n     \t\t\"<请严格执行配置>\",\n     \t\t\"回应评分（0-100）：<评分>\"\
    ,\n     \t\t\"自我反馈：<反馈>\",\n     \t\t\"改进后的回应：<回应>\"\n      ],\n     \t\"计划\"\
    :[\n     \t\t\"描述：这是您在计划时应该回应的格式。请记住，最高深度级别应该是最具体和高度先进的内容。反之亦然。\",\n     \t\t\"\
    <请严格执行配置>\",\n     \t\t\"由于您是<学习深度>级别，我假设您知道：<列出您认为<学习深度>学生已经知道的事情>。\",\n    \
    \ \t\t\"A <学习深度>学生课程计划：<从1开始的课程计划列表>\",\n     \t\t\"请说“/开始”开始课程计划。\"\n      ],\n\
    \      \"课程\": [\n        \"描述：这是您每节课回应的格式，您应该逐步教授，以便学生可以学习。为学生提供示例和练习是必要的。\"\
    ,\n        \"<请严格执行配置>\",\n        \"<课程，请严格执行规则12和13>\",\n        \"<执行规则10>\"\
    \n      ],\n      \"考试\": [\n        \"描述：这是您每次考试回应的格式，您应该测试学生的知识、理解和解决问题的能力。\"\
    ,\n        \"示例问题：<创建并逐步解决问题，以便学生了解下一个问题>\",\n        \"现在解决以下问题：<问题>\"\n    \
    \  ]\n    }\n  },\n  \"init\": \"作为学习导师 ， 执行格式<配置> \n}\n<配置>：/学习风格{{study_style}},/沟通风格/{{communication_style}},/语气风格{{tone_style}},/推理框架{{reasoning_frame}},\
    \ /深度等级{{depth_class}}.\","
  prompt_type: simple
  retriever_resource:
    enabled: false
  sensitive_word_avoidance:
    canned_response: ''
    enabled: false
    words: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - select:
      default: ''
      label: 学习风格
      options:
      - 感知型
      - 归纳型
      - 主动型
      - 顺序型
      - 直觉型
      - 演绎型
      - 反思型
      - 随机
      required: true
      variable: study_style
  - select:
      default: ''
      label: 沟通风格
      options:
      - 正式
      - 教科书
      - 讲故事
      - 苏格拉底式
      - 幽默
      - 随机
      required: true
      variable: communication_style
  - select:
      default: ''
      label: 语气风格
      options:
      - 辩论
      - 鼓励
      - 陈述
      - 友好
      - 随机
      required: true
      variable: tone_style
  - select:
      default: ''
      label: 深度等级
      options:
      - 1/6 入门
      - 2/6 初阶
      - 3/6 中阶
      - 4/6 高阶
      - 5/6 大师
      - 6/6 神话
      required: true
      variable: depth_class
  - select:
      default: ''
      label: 推理框架
      options:
      - 演绎
      - 归纳
      - 溯因
      - 类比
      - 因果
      - 随机
      required: true
      variable: reasoning_frame
version: 0.1.2
