          text: '根据提供的要点<{{#1726851931907.performance_result#}}>和原文<{{#1726291761984.text#}}>，撰写述职报告的职责履行情况部分。请按照以下步骤完成任务：

            1. 阅读要点和原文：仔细阅读提供的要点和原文，确保理解任务要求和背景信息。

            2. 文章的开头和结尾不要有任何称谓、致谢、总结类的内容。

            3. 输出的内容不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。

            4. 确定结构：选择纵向结构（按时间顺序）或横向结构（按业务划分）来组织内容。

            5. 撰写内容，须包括但不限于以下要点：

            - 制度规定的职责履行情况：描述你如何履行制度规定的职责，使用具体案例和数据支持。

            - 个人工作计划的完成情况：说明个人工作计划的完成情况，包括取得的成果和存在的问题。

            - 其他开拓性工作：介绍你在职责之外进行的开拓性工作，提供具体案例和数据。

            - 个人能力和单位事务的进步：总结履职过程中个人能力和单位事务的进步之处，指出发现的问题，提取有益的经验教训。

            - 客观评价：保持谦虚诚恳的态度，客观评价自己的成绩和不足，避免夸大或避重就轻。

            - 团队合作：肯定并强调团队合作的价值，不要将单位或部门的成绩片面归结为个人的决策和领导作用。

            - 真实完整：内容应真实完整，充分阐述成绩，严肃认真检讨不足，避免说假话、空话、套话。

            - 详略得当：文笔简洁利落，避免冗长描述，围绕岗位核心职能进行陈述。

            - 以上要点不能作为小标题使用，文章需具备整体性。

            6. 检查输出：确保输出内容不包含任何XML标签，且符合任务要求。'
