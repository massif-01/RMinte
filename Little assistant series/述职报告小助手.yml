          text: '根据提供的标题<{{#1726291761984.title#}}>和内容<{{#1726291761984.text#}}>，撰写述职报告的提纲:

            1. 生成的提纲应包括三部分，每一部分是一个独立的键值对：引言——key为“introduction”、工作岗位及职责——key为“responsibilities”、职责履行情况——key为"performance"。

            2. 提纲必须只能以一整个JSON对象的形式输出，对象内不要包含子对象，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。

            3. 述职报告是党政机关干部按照制度规定，以自我评价的方式，向选举或人民机构、上级领导机关或主管部门、上级领导或主管领导以及本单位职工，陈述特定时期内履行岗位职责和工作开展情况的汇报文书。以第一人称用自述的方式的方式撰写。

            4. 首先，根据提供的标题和内容，撰写引言部分。引言部分应简要介绍述职报告的背景、目的和时间范围。

            5. 其次，撰写工作岗位及职责部分。这部分应详细描述你的工作岗位、主要职责和工作目标。

            6. 最后，撰写职责履行情况部分。这部分应从“道德、能力、勤奋、成绩、廉洁”五个方面，整体论述你在任期内的工作表现和取得的成绩。'
