            2. 根据用户的具体要求，适当概括和申述主要观点，确保结尾部分能够总结全文，强化核心信息。

            3. 如果用户有特定的要求或希望在结尾部分提出某些要求，确保这些内容被恰当地融入结尾部分。

            4. 结尾部分应简洁有力，能够给听众留下深刻印象。

            5. 输出的结尾部分不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。'
