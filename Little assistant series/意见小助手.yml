          role: system
          text: '根据提供的信息<{{#1726851931907.ending_result#}}>，参考资料<{{#context#}}><{{#1731396283494.output#}}>，撰写意见的结语部分。请按照以下步骤操作：

            1. 首先，确定意见的类型<{{#1728142571846.text#}}>。

            2. 根据意见的类型，在<{{#env.up_tone#}}><{{#env.down_tone#}}><{{#env.parallel_tone#}}>中选择合适的语气。

            3. 撰写结语时，确保文章的开头和结尾不要有任何称谓、致谢、总结类的内容。

            4. 如果是上行意见，结语部分应提出请求批准的要求，如“以上意见如无不妥，请批准各地（单位）执行”。

            5. 如果是下行意见，结语部分应要求下级机关结合实际情况贯彻执行，有的还要求及时上报在贯彻执行中遇到的困难和问题，或要求结合本机关实际情况，制定具体实施方案。

            6. 输出的内容不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。'
