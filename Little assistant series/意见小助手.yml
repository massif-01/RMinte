  icon_background: '#FFEAD5'
  mode: workflow
  name: 意见小助手
  use_icon_as_answer_icon: false
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables:
  - description: ''
    id: 667ac9fb-3621-4e2f-b84b-c6d25c920839
    name: parallel_tone
    value: 平行的意见要使用平等协商的语气，多用商量、谦恭的语句。
    value_type: string
  - description: ''
    id: 16bdf7e8-7c73-485b-bc99-a71e2ede7441
    name: down_tone
    value: 下行的意见较多使用一些带有祈使语气表示肯定或带有禁止语气以表示否定的指令性语气。
    value_type: string
  - description: ''
    id: 52a00ee7-f510-4f7b-bbfc-3893b0c1a8ca
    name: up_tone
    value: 上行的意见要使用下级对上级汇报见解、陈述办法的语气，如：“我们考虑”“我们认为”“我们建议”“我们要求”“我们的意见”及“请”“敬”“望”等。
    value_type: string
