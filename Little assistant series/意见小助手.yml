        prompt_template:
        - id: d61277a8-38b0-4f5b-b2a4-3a4f0391292e
          role: system
          text: "根据提供的信息<{{#1726339723075.principal_result#}}>，参考资料<{{#context#}}><{{#1731396283494.output#}}>，撰写意见的主体部分。请遵循以下步骤：\n\
            1. 根据意见的类型<{{#1728142571846.text#}}>，从以下变量<{{#env.up_tone#}}><{{#env.down_tone#}}><{{#env.parallel_tone#}}>中选择适合的语气。\n\
            2. 字数不得少于3000字。\n3. 撰写意见时，确保文章的开头和结尾没有称谓、致谢、总结类的内容。\n4. 意见的主体部分应包括以下内容：\n\
            \   - 该党政机关的简介（如果适用）。\n   - 对有关问题或某项工作的建议或规范的解决办法。\n   - 对问题的深刻分析，并在此基础上提出解决问题的完整想法。\n\
            \   - 解决问题的重要意义、指导思想、基本原则、总体目标、方法步骤、保障措施等。\n   - 既要讲明政策和道理，又要具有可操作性。\n\
            1. 如果是规划性意见，内容繁多，可以列小标题，小标题下再分条撰写；如果是内容较单一集中的意见，一般采用分条式撰写。\n2. 意见写作要层层深入、环环相扣、脉络清晰、表达清楚。\n\
            3. 意见要结合实际，切实可行；从实际出发，实事求是。意见的提出，既要根据实际需要，又要考虑实现的可能性。\n4. 输出的内容不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。"
        selected: false
        title: 主体撰写
