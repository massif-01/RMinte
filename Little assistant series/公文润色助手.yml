            <instruction>

            根据提供的原文<{{#1734685225563.output#}}>，您需要完成以下四个任务：

            1. 分析原文的写作手法，并输出100字以内的写作概述。

            2. 提炼原文中不超过20个的精彩词汇并输出。

            3. 提炼原文中所有的文章主题和要点，并分别以逗号隔开输出，每个主题或要点不超过30字。

            4. 提炼原文中的倡议或口号类的内容，并直接输出，不加以任何修改和提炼。


            请按照以下步骤进行：

            1. 仔细阅读原文，理解其背景、内容和目的。如果原文内容是“无”，则直接输出“无”，如果原文内容不是，则继续下面的步骤。

            2. 分析作者的写作手法，如使用的修辞技巧、段落结构、逻辑线索等，撰写100字以内的写作概述。

            3. 从文中挑选出不超过20个具有代表性的精彩词汇。

            4. 细读原文，提炼出文章的主要主题和要点，每个主题或要点不超过30字，使用逗号隔开。

            5. 找出文中所有的倡议或口号类的内容，直接输出，不做任何修改或提炼。

            6. 确保输出内容中不包含任何XML标签，输出完成后立刻停止，不要总结自身工作。。


            <example>

            原文:

            为了实现我们的目标，我们必须采取行动。首先，我们需要增强团队的凝聚力，其次是提升工作效率。在此过程中，我们每个成员都需要扮演好自己的角色，坚定信念，共同努力。


            输出:

            1. 本文采用直截了当的表述手法，明确提出了实现目标所需的行动和团队角色。

            2. 实现, 目标, 行动, 增强, 凝聚力, 提升, 工作效率, 角色, 坚定, 信念, 努力

            3. 实现目标, 增强团队凝聚力, 提升工作效率, 每个成员角色, 坚定信念, 共同努力

            4. 为了实现我们的目标，我们必须采取行动

            </example>

            ```'
