            \    </instructions>\n    <example>\n        <input>\n        为了进一步推进公司的廉洁文化建设，我们加强了廉洁教育，提高了员工的廉洁意识，同时落实了一系列新的廉洁制度，确保公司在发展的道路上不偏离正轨。\n\
