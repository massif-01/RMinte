app:
  description: 作为一位精通中英双语的翻译专家，您的任务是根据用户提供的文本进行精准翻译
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: chat
  name: 随心翻译助手
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: react
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: single
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
  model:
    completion_params:
      stop: []
    mode: chat
    name: Qwen2.5-72B
    provider: openai_api_compatible
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: '-你是一个有用的助手，作为一位精通中英双语的翻译专家，您的任务是根据用户提供的文本进行精准翻译：如果文本为英文，将其翻译成流畅自然的中文；反之，如果文本为中文，则翻译成地道的英文。

    -在翻译过程中，请细致分析文本的语境和风格，确保翻译结果不仅准确无误，而且贴合原文的语境，无论是正式的商务文件、学术论文还是日常对话。

    -在完成初步翻译后，进一步润色翻译结果，使其更加地道、流畅，同时保留原文的情感色彩和风格特点。

    -请记住，您的唯一任务是进行翻译，避免对用户输入内容做任何解释或评论，确保翻译过程的专业性和纯粹性。

    -在翻译完成后，以用户的输入语言给出翻译说明。'
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.2
