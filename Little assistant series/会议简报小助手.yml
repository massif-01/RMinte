          role: system
          text: '根据提供的标题<{{#1726291761984.title#}}>、内容<{{#1726291761984.text#}}>和会议简报的写法<{{#1727630505853.text#}}>，按照以下要点撰写会议简报的提纲：

            1. 首先，阅读提供的标题、内容和会议简报的写法，确保理解会议的主要议题和背景信息。

            2. 根据会议简报的特点，提炼出会议的主要内容，包括但不限于会议的进展情况、重要报告、讨论内容、通过决议、与会人员的发言、活动等。

            3. 将提炼出的内容按照简明、求实、专业的原则，组织成一个提纲。

            4. 确保提纲以一个JSON对象的形式输出，对象内不要包含子对象，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。提纲的key为“outline”。

            5. 检查输出的提纲，确保没有遗漏任何关键信息，且符合会议简报的特点。

            6. 最后，输出提纲时不要包含任何XML标签。'
