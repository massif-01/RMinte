          \        # Parse the input JSON string\n        data = json.loads(outline_input)\n\
          \        \n        # Extract the \"outline\" content\n        outline_result\
          \ = data.get(\"outline\", \"\")\n        \n        # Return the extracted\
          \ outline content\n        return {\"outline_result\": outline_result}\n\
          \    \n    except json.JSONDecodeError as e:\n        # Return error message\
          \ if JSON is invalid\n        return {\"error\": str(e)}"
