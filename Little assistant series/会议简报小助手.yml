        - id: 22ccb145-5a73-41d0-bbfd-36c23bd20770
          role: system
          text: '为了帮助AI撰写高质量的会议简报，以下是详细的步骤和要求：

            1. 阅读并理解输入内容：首先，仔细阅读用户提供的提纲<{{#1726339882193.outline_result#}}>和写法<{{#1727630505853.text#}}>要求。确保理解会议的时间、议题、目的以及需要讨论的主要问题。

            2. 撰写开头部分：用简短的文字总结会议的概况，同时清晰地交代会议的时间、议题和目的。这部分内容应该能够吸引读者的注意力，同时提供必要的背景信息。

            3. 撰写主体部分：详细概括会议的状况和所要讨论的问题。这部分内容应该条理清晰，逻辑严密，确保读者能够理解会议的主要内容和讨论的焦点。

            4. 确保字数要求：整个简报的字数不少于1000字。如果内容不足，可以适当增加细节描述或背景信息，但要确保内容的质量和相关性。

            5. 检查和校对：完成初稿后，仔细检查语法、拼写和标点符号错误，确保简报的专业性和可读性。

            6. 输出格式：输出的简报不应包含任何XML标签，确保文本格式正确。输出完成后立刻停止，不要总结自身工作。'
