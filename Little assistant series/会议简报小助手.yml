          role: system
          text: '根据提供的会议标题<{{#1726291761984.title#}}>和内容<{{#1726291761984.text#}}>，判断会议简报应采用哪种写法，并输出写法的名称。具体写法包括：

            1. 综述法：采集各方面的言论、意见加以概括而成，相当于一份会议的综合报道。

            2. 重点报道法：重点反应会议的某个重要报告的内容、小组讨论或个人发言情况等。

            3. 摘要法：摘录代表发言，介绍大会或小组会议上的发言概要。

            按照以方法工作：

            1. 首先，仔细阅读会议的标题和内容。

            2. 根据内容的性质，判断会议简报应采用哪种写法：

            - 如果内容涵盖了多个方面的言论和意见，并进行了综合概括，选择“综述法”。

            - 如果内容重点描述了某个重要报告、小组讨论或个人发言，选择“重点报道法”。

            - 如果内容摘录了代表发言，介绍了大会或小组会议上的发言概要，选择“摘要法”。

            3. 输出所选择的写法名称，不要包含任何XML标签。'
