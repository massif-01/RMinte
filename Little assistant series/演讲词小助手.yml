            2. 根据演讲的主题<{{#1726291761984.title#}}>和内容<{{#1726851931907.ending_result#}}>，构思一个合适的结尾。结尾应是对演讲内容的自然延伸，避免引入新的、无关的信息。参考资料<{{#context#}}><{{#1730898032112.output#}}>。

            3. 结尾部分可以采用归纳、升华、希望或号召的方式，确保结尾能够收拢全篇、总结全文，起到运筹帷幄的效果。

            4. 确保结尾部分语言流畅、情感真挚，能够引起听众的共鸣。

            5. 最后，检查结尾部分，确保没有使用任何XML标签。输出完成后立即结束，不要总结自身工作。'
