        - id: d61277a8-38b0-4f5b-b2a4-3a4f0391292e
          role: system
          text: '任务描述：您需要为一位演讲词写手撰写演讲词的主体部分。演讲词的主体部分是演讲的核心内容，篇幅较大，需要在理论上一步步说服听众，在内容上一步步吸引听众，在情感上一步步感染听众。同时，要精心安排结构层次，层层深入，环环相扣，自然地推向高潮。主体部分的展开方式主要有并列式、递进式和并列递进结合式。

            操作步骤：

            1. 阅读提供的演讲主题<{{#1726291761984.title#}}>和背景信息<{{#1726339723075.principal_result#}}>。

            2. 根据演讲的主题和背景信息，选择合适的展开方式（并列式、递进式或并列递进结合式）。参考资料<{{#context#}}><{{#1730898032112.output#}}>。

            3. 文章的开头不要撰写称谓，结尾不要撰写任何致谢类与总结类的内容。

            4. 撰写演讲词的主体部分，确保内容符合上述要求。

            5. 确保演讲词的主体部分结构清晰，逻辑严密，能够有效吸引和感染听众。

            6. 输出的演讲词主体部分不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。'
