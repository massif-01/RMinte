    - data:
        code: "import re\n\ndef main(arg1: str) -> dict:\n    # 找到所有标题行\n    title_lines\
          \ = re.findall(r'^(#+) .+', arg1, re.MULTILINE)\n    \n    # 确定最大标题级别\n\
          \    if not title_lines:\n        return {\"result\": []}\n    max_title_level\
          \ = min(len(title) for title in title_lines)\n    \n    # 确定第二大标题级别\n  \
          \  second_title_level = max_title_level + 1\n    second_title_pattern =\
          \ f'^{\"#\" * second_title_level} '\n    \n    # 初始化一个空数组存储结果\n    result\
          \ = []\n    \n    # 逐行处理输入文本\n    for line in arg1.split('\\n'):\n     \
          \   # 使用正则表达式匹配第二大标题级别的行\n        if re.match(second_title_pattern, line):\n\
          \            # 将匹配的行添加到结果数组中\n            result.append(line)\n    \n  \
          \  # 将结果数组封装在字典中并返回\n    return {\"result\": result}\n\n# 示例输入\nmarkdown_text\
          \ = \"\"\"\n# Title\n## Subtitle\n### Sub-Subtitle\n#### Header 1\nSome\
          \ text\n## Another Subtitle\nMore text\n#### Header 2\n\"\"\"\n\n# 调用函数并打印结果\n\
          result = main(markdown_text)\nprint(result)"
