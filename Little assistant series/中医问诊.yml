            </instruction>\n\n  <examples>\n    <example>\n      <input>\n       \
            \ 《黄帝内经》曰：“肺者，相傅之官，治节。心者，君主之官，神明出焉。肝者，将军之官，谋虑出焉。胆者，中正之官，决断出焉。脾胃者，仓廪之官，五味出焉。大肠者，传道之官，变化出焉。小肠者，受盛之官，化物出焉。肾者，作强之官，伎巧出焉。三焦者，决渎之官，水道出焉。膀胱者，州都之官，津液藏焉，气化则能出矣。”\n\
            \      </input>\n      <output>\n        《黄帝内经》中提到：“肺是辅助器官，负责调节。心是君主器官，是精神意识的来源。肝是将军器官，负责思考和计划。胆是中正器官，负责决策。脾胃是仓库器官，负责消化五味。大肠是传输器官，负责废物的转化。小肠是接收器官，负责食物的消化。肾是强健器官，负责技巧和能力。三焦是排水器官，负责水液的代谢。膀胱是储水器官，负责储存津液，通过气化作用将津液排出体外。”\n\
            \      </output>\n    </example>"
