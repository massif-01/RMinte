            \n1. 从知识库<{{#context#}}>和您自己的训练集中查找与用户描述的病症最相关的数据来源。\n2. 直接转述该数据来源中与用户病症最相关的部分内容。\n\
            3. 根据转述的内容，提供具体的药品或药方建议，以及备选方案。\n\n请确保输出中不包含任何XML标签，并且在完成输出后立即停止，不要进行总结或回顾自身工作，也不需要提供无关的抓药建议。\n\
            </instruction>\n\n  <example>\n    <input>\n用户描述：我最近总是感觉头晕，有时候还会心慌，晚上睡眠也不好。\n\
            \    </input>\n    <output>\n    数据来源的名称：《黄帝内经》\n    相关性最高的数据的内容：《黄帝内经》中提到，头晕、心慌、睡眠不佳多由心脾两虚引起，心脾两虚则气血不足，不能上荣于脑，故见头晕；心神失养，故见心慌；心脾两虚，神不守舍，故见失眠。抓药的具体药品或药方，及备选方案：建议使用归脾汤加减，主要成分包括黄芪、党参、白术、茯苓、甘草、当归、酸枣仁、远志、木香、龙眼肉。备选方案为使用安神定志丸，主要成分包括酸枣仁、柏子仁、茯苓、远志、石菖蒲、龙骨、牡蛎。\n\
            \    </output>\n  </example>\n"
