          role: system
          text: '根据提供的信息<{{#1726339723075.principal_result#}}>，撰写会议方案的主体部分。请按照以下步骤完成任务：

            1. 确定会议主题：基于输入的信息，明确会议的主题<{{#1726291761984.title#}}>、内容和议题。

            2. 制定会议议程：列出会议的主要议程，包括每个议程的具体内容和时间安排。

            3. 安排会议日程：详细列出会议的开始和结束时间，以及各个议程的具体时间安排。

            4. 确定会议形式：说明会议是线上、线下还是混合形式，以及具体的会议地点。

            5. 组织会务机构：列出会务机构的组织结构和分工，包括负责人和具体职责。

            6. 准备会议文书：列出需要准备的会议文书，如会议通知、议程表、参会人员名单等。

            7. 预算会议经费：详细列出会议的预算，包括场地费用、设备租赁、交通费用、餐饮费用等。

            8. 制定保障措施：说明为确保会议顺利进行而采取的保障措施，如技术支持、安全措施等。

            9. 描述筹备情况：简要说明会议筹备的进展情况，包括已完成的工作和待完成的工作。

            在撰写过程中，请注意以下几点：

            - 科学安排：统筹考虑各项内容，确保方案的科学性和合理性。

            - 可行性与灵活性：方案中所提出的任务目标、步骤安排、落实办法、措施要求等，一定要符合客观的实际情况，要着眼于工作的发展变化趋势。

            - 时间与弹性：既要尽可能准确地把握会议进行的时间和关键节点，又要为相关活动留有弹性空间，以防安排太紧、太慢而造成被动的局面。

            - 格式要求：输出的内容不应包含任何XML标签，输出完成后立即结束，不要总结自身工作。'
