          role: system
          text: '根据提供的标题<{{#1726291761984.title#}}>和内容<{{#1726291761984.text#}}>，按照以下要求撰写会议方案的提纲：

            1. 提纲必须只能以一整个JSON对象的形式输出，对象内不要包含子对象，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。

            2. 首先，根据提供的标题和内容，撰写会议方案的开头部分。开头部分应写明召开会议的原由、会议的宗旨、会议的规模、召开单位、会议名称，以及会议时间、地点、会期等，key为“beginning”。

            3. 其次，撰写会议方案的主体部分。主体部分应分条列项写明会议的主题(内容、议题)、议程、日程、会议形式、会务机构的组织和分工、会议文书、会议经费、保障措施、筹备情况等事项，key为“principal”。

            4. 最后，撰写会议方案的结尾部分。结尾部分根据会议方案的性质而定，如果属于夏季机关请示上级机关的，可写上类似请示报告结尾的用语；不需要总结会议的主要内容，强调会议的重要性和预期成果，key为"ending"。

            5. 确保每个部分的内容清晰、具体，具有针对性、指导性和可操作性。

            6. 在撰写过程中，注意科学安排，统筹考虑，确保方案的可行性和灵活性。

            7. 输出的会议方案提纲不应包含任何XML标签。'
