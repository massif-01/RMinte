app:
  description: 提升您的STEMM（科学、技术、工程、数学和医学）写作，以满足严格的学术标准。通过输入一段或整篇文章的STEMM风格文本，用户将获得一个高度打磨、符合学术要求的版本。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 写作监督器
  use_icon_as_answer_icon: true
kind: app
version: 0.1.4
