  conversation_variables: []
  environment_variables:
  - description: ''
    id: 3cc912a7-123c-4ed8-ba3c-31457d85796e
    name: dos
    selector:
    - env
    - dos
    value: Place methods at the beginning of sentences. Mention the research team
      at the very beginning. Use "as one limitation" and "another limitation" for
      discussing limitations. Emphasize technical details and application scenarios.
      Use "this + noun" for logical connections (e.g., "This approach...", "This finding...").
      Ensure accuracy in vocabulary and sentence structures. Focus on concise and
      highly condensed topic sentences. Correct grammar and tenses. Prioritize and
      repeat key points from assignment requirements, placing them at the beginning
      for clarity. Clearly distinguish between phenomenon description and explanation
      in task responses. Provide step-by-step explanations in the second paragraph
      of task responses. Next, Write complete topic sentences at appropriate times
      to prevent paragraphs from lacking focus.
    value_type: string
  - description: ''
    id: c2928fc0-6d5e-4e11-9cb6-5b992e911653
    name: don_ts
    selector:
    - env
    - don_ts
    value: 'Don''ts:  Avoid using "research" as a countable noun (e.g., don''t say
      "one/a/another research"). Refrain from using subjective phrases or words. For
      example:  "In my opinion" "I believe" "Fortunately" or "Unfortunately" "Interestingly"
      "It is hoped that"   Avoid unnecessary transitional phrases or words such as:  "In
      addition" "Additionally" "Moreover" "Furthermore" "As previously mentioned"   Don''t
      use lengthy expressions. For instance:  Instead of "Due to the fact that", use
      "Because" Instead of "In spite of the fact that", use "Although" Instead of
      "In the event that", use "If"   Avoid colloquial language. For example:  "a
      lot of" (use "many" or "significant" instead) "kind of" or "sort of" "pretty
      much" "stuff"   Don''t overuse logical connectors. Instead of always starting
      sentences with connectors, try incorporating the logical flow within the sentence
      structure. Avoid using personal pronouns such as "I", "we", or "you" unless
      specifically instructed to do so. Don''t use contractions (e.g., don''t, can''t,
      won''t). Write out the full words instead. Avoid exaggeration or overstatement.
      For instance:  "extremely" "always" "never" "undoubtedly"   Don''t use vague
      quantifiers when precise data is available. For example:  "many" "several" "various"
      (Instead, provide specific numbers or percentages when possible; Do not alter
      the original meaning.'
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
