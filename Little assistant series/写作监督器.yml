        batch_count_limit: 5
        file_size_limit: 200
        image_file_size_limit: 100
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 'Welcome to your STEMM Writing Supervisor! 🧠✍️

      Ready to take your academic writing to the next level? 🚀 I''m here to help you
      polish your STEMM (Science, Technology, Engineering, Mathematics, and Medicine)
      papers and reports!

      Just paste your original text in the input box below, and I''ll work my magic
      ✨ to enhance your writing. You''ll see the results with:

      🔴 Red strikethrough for deleted text

      🟢 Green highlights for modifications and additions

      Let''s collaborate to make your STEMM writing shine! 💎 Remember, practice makes
      perfect, so don''t be shy – input your text and let''s get started on your journey
      to becoming a stellar academic writer! 📚💪

      Input your original text here 👇'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: true
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: true
      language: ''
      voice: ''
