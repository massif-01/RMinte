          text: "为了完成工作类讲话稿主体部分的撰写任务，请遵循以下步骤：\n1. 在撰写中只输出正文，不要附带生成任何总结自身任务的文字。\n2.\
            \ 文章的开头不要撰写称谓，结尾不要撰写任何致谢类的内容。\n3. 首先，理解讲话的目的和会议的核心内容<{{#1726339723075.principal_result#}}>，这将指导讲话稿的主题和重点。\n\
            4. 根据讲话的目的，选择以下一种或多种写作方向：\n   a. 阐述如何深入理解文件、指示或会议精神，强调其重要性和实施策略。\n   b.\
            \ 明确工作任务，分析当前形势，提出具体的工作意见或建议。\n   c. 结合本单位的实际情况，提出贯彻上级指示的措施或建议。\n   d.\
            \ 对其他领导人的讲话进行补充，提供额外的观点或信息。\n   e. 围绕会议中心议题，结合自己分管的工作，分享个人见解或看法。\n6. 在写作过程中，确保讲话稿符合工作类讲话稿的特点，即对前一阶段工作进行总结，包括经验、教训、成绩和缺点，并对下一阶段的工作目标、任务、重点和具体措施进行规划。\n\
            7. 语言应正式、准确，避免使用口语化或模糊的表达。\n7. 结尾部分应总结讲话的主要观点，强调讲话的核心信息，为听众留下深刻印象。\n8.\
            \ 输出的讲话稿主体部分不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。"
