            2. 根据以下类型定义，判断该研究属于哪一种类型：

            - 描述性工作研究：如果研究主要是对事物、问题、局势进行全面的介绍，目的在于对研究对象进行目的性的调查了解，解决“是什么”的问题。

            - 解释性工作研究：如果研究在明确事物基本情况的基础上，做进一步的探索研究，发掘存在的问题和难点，解释造成现状的原因，总结某项工作成功的经验或失败的教训，解决“为什么”的问题。

            - 探索性工作研究：如果研究旨在预测未来趋势或提出建议，分为预测性工作研究和建议性工作研究两种。

            - 评价性工作研究：如果研究针对出现的问题和状况，考察事物发展的情况、前期工作的实施效果等，并做出客观公正的评价，解决“怎么样”的问题。

            3. 根据上述判断，输出研究的类型名称，不包含任何XML标签。'
