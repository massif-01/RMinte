          role: system
          text: '根据提供的信息<{{#1726339723075.principal_result#}}>，参考资料<{{#context#}}><{{#1731247873921.output#}}>，撰写工作研究的正文部分，要求如下：

            1. 文章的开头和结尾不要有任何称谓、致谢、总结类的内容。

            2. 输出的内容不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。

            3. 正文的第一目的是分析问题：探究问题产生的原因，应按照由表及里的方式进行研究，注意挖掘表象背后的深层次原因。

            4. 分析问题这部分内容可采用重视结构表述，既按照由远及近、由此及彼、从过去到现在的时间进行也可以采用横式结构，将材料分为若干类别，逐一进行介绍，如经济原因、政治原因、文化原因等。根据提供的信息判断使用什么结构来撰写。

            5. 正文的第二目的是解决问题：对于产生问题的原因，逐一提出解决对策，这是工作研究的最终目的和意义所在，要提出切实可行的解决办法，避免空谈阔论。

            6. 要详细的撰写，字数不少于2000字。'
