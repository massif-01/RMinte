        - id: b1bf3f93-352c-436a-847b-26adaace93f0
          role: system
          text: '根据提供的标题<{{#1727159899881.title#}}>、内容<{{#1727159899881.text#}}>和经验材料的类型<{{#1727184973802.text#}}>，参考资料<{{#context#}}><{{#1731249892843.output#}}>，按照以下要求撰写经验材料的提纲：

            1. 经验材料包括导言、个人基本情况、事迹说明、经验教训和结尾五部分，每一个部分是一个独立的键值对：导言——key为“introduction”、个人基本情况——key为“basic_information”、事迹说明——key为"description"、经验教训——key为"experience"、结尾——key为"ending"。

            2. 提纲必须只能以一整个JSON对象的形式输出，对象内不要包含子对象，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。

            3. 理解背景：理解经验材料的背景和目的。经验材料是为了表彰先进、传播事迹、震慑警醒、交流推广、积累资料等，将具有先进性的各种经验资料进行综合整理写出的文字材料。

            4. 实事求是，客观描述：确保所有描述都是基于真实、准确的资料，避免夸大或杜撰。对于先进事迹，用平和的语言描述；对于错误和问题，辩证对待，避免全盘否定。

            5. 选典型，以小见大：选择具有典型性和代表性的内容，能够引发深层次的思考和广泛的讨论。围绕当前的中心工作选取典型，发挥正确的引导作用。

            6. 层次分明，论据结合：合理安排材料，做到条理清晰、重点突出。在阐述观点时，引用相关材料，提高文章的说服力。

            7. 主题明确，有感染力：确保主题褒贬分明，挖掘典型所蕴含的本质特征和价值意义。用生动的语言描述典型事例的细节和重点，感染和打动读者，发人深省。

            8. 输出不应包含任何XML标签。'
