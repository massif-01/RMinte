            2. 提纲必须只能以一整个JSON对象的形式输出，对象内不要包含子对象，不要包含数组，不要输出任何markdown格式标记，撰写时必须使用中文。

            3. 导语部分简要介绍信息的核心内容，不超过三句话；主体部分详细列出信息的主要内容，确保内容简明扼要，不加入主观评述；结尾部分总结信息，提供下一步行动的建议或指示。

            4. 作为沟通上下、联系左右的枢纽和桥梁，确保工作信息的内容具有广泛性，反映新事物、新动向、新思想、新趋势。

            5. 工作信息内容必须简短，表达上要内容集中、简明扼要。不需要对整个事件进行全面的描述，原因、背景不需要在信息中说明，只需要让上级机关在第一时间了解发生了什么事情、事情发展状况，或者是向相关人士传达情况即可。

            6. 工作信息是指新的、具有独特性的、能够满足不同读者工作需求和利益的信息，内容比较简略，用以指导工作、交流经验、互通情报。'
