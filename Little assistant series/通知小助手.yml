            1. 仔细阅读提供的信息，确定通知的内容性质。\n2. 根据内容性质选择合适的结语类型：\n   - 如果内容关系到全局性的重大方针、政策和规定，使用“希遵照办理”、“希依照执行”等。\n\
            \   - 如果内容提出了政策性要求，但允许结合本地区、本单位的实际情况办理，使用“请研究执行”。\n   - 如果内容的要求只是根据一定条件提出来的，具有参考价值的意见、建议或经验，或者是应该引起注意的问题，使用“请参照执行”。\n\
            \   - 如果内容属于探索性的，或者法律程序不够完备的政策性问题，需要在执行中逐步完善，使用“请研究执行”、“希研究执行”、“试行中有何意见请随即告知”等。\n\
            3. 撰写结语时，确保文章的开头和结尾不要有任何称谓、致谢、总结类的内容。\n4. 输出的内容不应包含任何XML标签。输出完成后立即结束，不要总结自身工作。"
