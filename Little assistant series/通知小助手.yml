          role: system
          text: '根据提供的信息<{{#1726339723075.principal_result#}}>和类型<{{#1728142571846.text#}}>，撰写通知类公文的主体。请遵循以下步骤：

            1. 根据通知的类型，选择合适的写作风格（如贯通式或分条列项式）。

            2. 开始撰写通知主体，确保内容准确、逻辑清晰，避免使用任何称谓、致谢、总结类的内容。不要撰写标题。

            3. 对于简单通知，如任免通知，写清任免人员姓名、具体职务等信息。

            4. 对于复杂通知，如指示性通知，详细说明通知的内容和在贯彻执行中应注意的问题，确保各条、项之间的逻辑顺序。

            5. 对于命令性通知，讲清楚情况和问题，重点提出指示性意见、要求及措施，确保政策界限清楚、明确。

            6. 在交代工作事项时，注意表达的准确性，避免下级机关出现误解或找到可钻的漏洞。

            7. 使用庄严郑重、语气肯定、不容置疑的语言，可使用祈使句、成语和四字词组，增强坚定有力的气势。

            8. 确保每条措施都切合实际，注意事项交代完整和清楚，做到主旨明确，结构严谨，用语通畅。

            9. 完成撰写后，立即结束，不要总结自身工作，且输出内容不应包含任何XML标签。'
