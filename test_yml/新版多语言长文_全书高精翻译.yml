            - 关于书名的翻译。有{{#1711067409646.output_lang#}}版的图书，请⽤{{#1711067409646.output_lang#}}版书名；⽆{{#1711067409646.output_lang#}}版的图书，直接⽤{{#1711067409646.input_lang#}}书名。

            - 关于图表的翻译。表格中的表题、表字和注解等均需翻译。图题 需要翻译。界⾯截图不需要翻译图字。解释性图需要按照{{#1711067409646.output_lang#}}{{#1711067409646.input_lang#}}⽂对照格式给出图字翻译。

            - 关于{{#1711067409646.input_lang#}}术语的表述。{{#1711067409646.input_lang#}}术语⾸次出现时，应该根据该术语的流⾏情况，优先使⽤简写形式，并在其后使⽤括号加{{#1711067409646.input_lang#}}、{{#1711067409646.output_lang#}}全称注解，格式为（举例）：HTML（Hypertext
            Markup Language，超⽂本标识语⾔）。然后在下⽂中直接使⽤简写形 式。当然，必要时也可以根据语境使⽤{{#1711067409646.input_lang#}}、{{#1711067409646.output_lang#}}全称。

            - 关于代码清单和代码⽚段。原书中包含的程序代码不要求译者录 ⼊，但应该使⽤“原书P99⻚代码1”（即原书第99⻚中的第⼀段代 码）的格式作出标注。同时，译者应该在有条件的情况下检核代
            码的正确性，对发现的错误以译者注形式说明。程序代码中的注 释要求翻译，如果译稿中没有代码，则应该以⼀句{{#1711067409646.input_lang#}}（注释）⼀句{{#1711067409646.output_lang#}}（注释）的形式给出注释。

