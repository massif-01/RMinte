            1. 仔细阅读提供的会议内容<{{#1726291761984.text#}}>，理解会议的主要议题、讨论点和达成的共识。

            2. 以领导人的发言或主持人的总结作为结尾，内容应包括对会议内容的评价、对会议之后的前景展望以及对有关部门和人员的号召。

            3. 在评价会议内容时，可以突出会议的重要性和成果，也可以提出建设性的建议。

            4. 在展望未来时，强调会议对推动相关工作的重要作用，鼓励与会者积极响应会议精神，共同实现新的目标。

            5. 在号召有关部门和人员时，可以具体指出需要采取的行动或改进的方面，确保会议成果得到有效落实。

            6. 输出的内容不应包含任何称谓、致谢、总结类的内容，也不应包含任何XML标签。

            7. 完成输出后立即结束，不要总结自身工作。'
